name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The pipeline tests drive a physics simulator through the real DSP
      # over multiple seeds, so they are slow by nature rather than by
      # accident. Budget accordingly.
      - run: npm test
        timeout-minutes: 15

  firmware:
    name: firmware build (esp32c6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF v5.1.2
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1.2
          target: esp32c6
          path: firmware/trinetra-csi-node
